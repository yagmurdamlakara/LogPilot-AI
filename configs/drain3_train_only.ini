# Explicit equivalent of Drain3 0.9.11 TemplateMinerConfig defaults.
# This file is used for future train-only Drain3 runs.
# Historical runs were executed without drain3.ini and therefore used these defaults.

[PROFILING]
enabled = false
report_sec = 60

[SNAPSHOT]
snapshot_interval_minutes = 5
compress_state = true

[DRAIN]
engine = Drain
sim_th = 0.4
depth = 4
max_children = 100
# max_clusters is intentionally omitted: Drain3 default is None (unlimited).
extra_delimiters = []
parametrize_numeric_tokens = true

[MASKING]
masking = []
mask_prefix = <
mask_suffix = >
parameter_extraction_cache_capacity = 3000
